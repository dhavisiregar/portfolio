    <!-- Sets data-theme before first paint so a returning visitor's saved
         theme (or their OS preference, first visit) applies immediately —
         without this, the page would flash dark (the CSS default) then jump
         to light for anyone who has light mode saved/preferred. Keep this in
         sync with readInitialTheme() in src/theme/ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // localStorage/matchMedia unavailable — CSS default (dark) applies.
        }
      })();
    </script>
